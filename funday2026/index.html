<!doctype html>
<html lang="hu">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Funday 2026</title>
  <meta name="description" content="Funday 2026">
  <meta name="theme-color" content="#0b2346">
  <style>
    :root{
      --navy:#081a34;
      --navy2:#123865;
      --gold:#e6b85c;
      --muted:#728096;
    }
    *{box-sizing:border-box}
    body{
      margin:0;
      min-height:100vh;
      display:grid;
      place-items:center;
      padding:28px;
      font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;
      color:#fff;
      background:
        radial-gradient(circle at 20% 0%,rgba(230,184,92,.22),transparent 30%),
        linear-gradient(135deg,var(--navy),var(--navy2));
    }
    main{
      width:min(860px,100%);
      text-align:center;
    }
    img{
      width:100%;
      border-radius:30px;
      box-shadow:0 28px 90px rgba(0,0,0,.32);
    }
    h1{
      margin:28px 0 10px;
      font-size:clamp(48px,9vw,90px);
      line-height:.9;
      letter-spacing:-.07em;
    }
    p{
      margin:0;
      color:rgba(255,255,255,.74);
      font-size:19px;
      font-weight:700;
    }
    a{
      display:inline-flex;
      margin-top:26px;
      padding:12px 17px;
      border-radius:14px;
      color:var(--navy);
      background:#fff;
      font-weight:950;
      text-decoration:none;
    }
  </style>
</head>
<body>
  <main>
    <img src="cover.svg" alt="Funday 2026">
    <h1>Funday 2026</h1>
    <p>Részletek hamarosan.</p>
    <a href="/">← Főoldal</a>
  </main>
</body>
</html>
